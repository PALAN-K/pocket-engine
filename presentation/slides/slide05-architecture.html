<!DOCTYPE html>
<html>
<head>
<style>
html { background: #000000; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #000000; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
h1 {
  color: #FFFFFF; font-size: 28pt; text-align: center;
  margin: 30pt 0 25pt;
}
.row {
  display: flex; justify-content: center; margin: 0 40pt;
}
.card {
  background: #1A1A1A; border-radius: 12pt; margin: 0 15pt;
  padding: 25pt 20pt; width: 260pt;
}
.card-accent {
  border-top: 4pt solid #EB0028;
}
.card-blue {
  border-top: 4pt solid #3B82F6;
}
h3 { color: #FFFFFF; font-size: 18pt; margin: 0 0 8pt; }
p { color: #999999; font-size: 11pt; margin: 4pt 0; line-height: 1.4; }
p.tag { color: #EB0028; font-size: 10pt; margin-top: 12pt; }
p.tag-blue { color: #3B82F6; font-size: 10pt; margin-top: 12pt; }
</style>
</head>
<body>
  <h1>2-App <span style="color:#EB0028;">Architecture</span></h1>
  <div class="row">
    <div class="card card-blue">
      <h3>PocketMonitor</h3>
      <p>Google Play Store</p>
      <p>디바이스 헬스 모니터링</p>
      <p>서버 상태 대시보드</p>
      <p>일일 안전 리포트</p>
      <p>AdMob 광고 수익화</p>
      <p class="tag-blue">Play Store 정책 100% 준수</p>
    </div>
    <div class="card card-accent">
      <h3>PocketEngine</h3>
      <p>사이드로드 (Firebase Hosting)</p>
      <p>원클릭 Ubuntu 24.04 설치</p>
      <p>Dropbear SSH 서버</p>
      <p>7계층 Keep-Alive</p>
      <p>백그라운드 상시 가동</p>
      <p class="tag">광고 없음 · 완전 무료</p>
    </div>
  </div>
</body>
</html>
