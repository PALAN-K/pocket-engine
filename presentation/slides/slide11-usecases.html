<!DOCTYPE html>
<html>
<head>
<style>
html { background: #000000; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #000000; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}
h1 {
  color: #FFFFFF; font-size: 28pt; text-align: center;
  margin: 0 0 25pt;
}
h1 span { color: #EB0028; }
.grid {
  display: flex; flex-wrap: wrap; justify-content: center;
  margin: 0 60pt; width: 520pt;
}
.item {
  background: #1A1A1A; border-radius: 10pt;
  padding: 18pt 12pt; margin: 5pt;
  width: 145pt; text-align: center;
}
h3 { color: #FFFFFF; font-size: 15pt; margin: 0 0 5pt; }
p { color: #888888; font-size: 10pt; margin: 0; line-height: 1.4; }
</style>
</head>
<body>
  <h1>무엇이든 <span>설치</span>할 수 있습니다</h1>
  <div class="grid">
    <div class="item">
      <h3>AI 에이전트</h3>
      <p>PicoClaw, OpenClaw<br>24시간 자동 응답</p>
    </div>
    <div class="item">
      <h3>자동화 도구</h3>
      <p>n8n, Dify<br>워크플로우 자동화</p>
    </div>
    <div class="item">
      <h3>웹 서버</h3>
      <p>바이브코딩 웹앱<br>개인 포트폴리오</p>
    </div>
    <div class="item">
      <h3>개발 서버</h3>
      <p>Git, Node.js, Python<br>테스트 환경</p>
    </div>
    <div class="item">
      <h3>스마트홈 허브</h3>
      <p>Home Assistant<br>IoT 제어</p>
    </div>
    <div class="item">
      <h3>파일 서버</h3>
      <p>개인 클라우드<br>NAS 대용</p>
    </div>
  </div>
</body>
</html>
